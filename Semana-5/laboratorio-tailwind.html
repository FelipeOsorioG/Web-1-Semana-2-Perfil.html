<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .lista {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.5rem;
        }

        .tarjeta {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 4px 6px #0000001a;
        }

        .tarjeta h3 {
            font-size: 1.125rem;
            font-weight: 700;
            margin: 0.5rem 0 0;
        }

        .tarjeta .precio {
            color: #4f46e5;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .tarjeta button {
            margin-top: auto;
            background: #4f46e5;
            color: #ffffff;
            border: 0;
            border-radius: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
        }

        .tarjeta button:hover {
            background: #4338ca;
        }

        @media (max-width: 700px) {
            .lista {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-slate-100 p-8">
    <main class="mx-auto max-w-6xl">
        <h1 class="text-3xl font-bold text-slate-900 mb-8">Comparación: CSS propio y Tailwind</h1>

        <h2 class="text-2xl font-bold mb-4">A · CSS propio</h2>
        <div class="lista mb-10">
            <article class="tarjeta">
                <h3>Producto 1</h3>
                <p class="precio">$99.900</p>
                <button>Agregar</button>
            </article>
            <article class="tarjeta">
                <h3>Producto 2</h3>
                <p class="precio">$45.000</p>
                <button>Agregar</button>
            </article>
            <article class="tarjeta">
                <h3>Producto 3</h3>
                <p class="precio">$32.500</p>
                <button>Agregar</button>
            </article>
        </div>

        <h2 class="text-2xl font-bold mt-10 mb-4">B · Tailwind</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <article class="bg-white rounded-xl shadow-md p-4 flex flex-col">
                <h3 class="text-lg font-bold mt-2">Producto 1</h3>
                <p class="text-indigo-600 font-semibold my-2">$99.900</p>
                <button class="mt-auto bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Agregar</button>
            </article>
            <article class="bg-white rounded-xl shadow-md p-4 flex flex-col">
                <h3 class="text-lg font-bold mt-2">Producto 2</h3>
                <p class="text-indigo-600 font-semibold my-2">$45.000</p>
                <button class="mt-auto bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Agregar</button>
            </article>
            <article class="bg-white rounded-xl shadow-md p-4 flex flex-col">
                <h3 class="text-lg font-bold mt-2">Producto 3</h3>
                <p class="text-indigo-600 font-semibold my-2">$32.500</p>
                <button class="mt-auto bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Agregar</button>
            </article>
        </div>
    </main>
</body>
</html>
